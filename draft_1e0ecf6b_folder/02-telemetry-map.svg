<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect x="0" y="0" width="1680" height="1120" fill="#F5F1EE"/>
<text x="64" y="74" font-size="40" font-weight="700" fill="#1E2421"><tspan x="64" dy="0">数据采集与证据关联</tspan></text>
<text x="64" y="124" font-size="24" font-weight="400" fill="#63716A"><tspan x="64" dy="0">需求、执行、图片版本各有标识；阶段事件用于定位，用户反馈用于采用统计</tspan></text>
<rect x="64" y="190" width="286" height="170" rx="20" fill="#FFFFFF"/>
<text x="92" y="238" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">上传与抠图</tspan></text>
<text x="92" y="285" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">input_id</tspan><tspan x="92" dy="36.0">input_revision</tspan></text>
<rect x="398" y="190" width="286" height="170" rx="20" fill="#FFFFFF"/>
<text x="426" y="238" font-size="29" font-weight="700" fill="#08754C"><tspan x="426" dy="0">受理与规划</tspan></text>
<text x="426" y="285" font-size="24" font-weight="400" fill="#1E2421"><tspan x="426" dy="0">task_id → job_id</tspan><tspan x="426" dy="36.0">prompt_version</tspan></text>
<rect x="732" y="190" width="286" height="170" rx="20" fill="#FFFFFF"/>
<text x="760" y="238" font-size="29" font-weight="700" fill="#08754C"><tspan x="760" dy="0">三方向生成</tspan></text>
<text x="760" y="285" font-size="24" font-weight="400" fill="#1E2421"><tspan x="760" dy="0">concept_id</tspan><tspan x="760" dy="36.0">model / 耗时 / 错误</tspan></text>
<rect x="1066" y="190" width="286" height="170" rx="20" fill="#FFFFFF"/>
<text x="1094" y="238" font-size="29" font-weight="700" fill="#08754C"><tspan x="1094" dy="0">合成与保存</tspan></text>
<text x="1094" y="285" font-size="24" font-weight="400" fill="#1E2421"><tspan x="1094" dy="0">asset_id + version</tspan><tspan x="1094" dy="36.0">尺寸 / 文件 / 规则</tspan></text>
<polyline points="350,275 398,275" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="684,275 732,275" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="1018,275 1066,275" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="1352,275 1480,275 1480,420 1066,420 1066,470" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="898" y="470" width="518" height="172" rx="20" fill="#FFFFFF"/>
<text x="926" y="518" font-size="29" font-weight="700" fill="#08754C"><tspan x="926" dy="0">展示、导出与采用</tspan></text>
<text x="926" y="565" font-size="24" font-weight="400" fill="#1E2421"><tspan x="926" dy="0">加载且可见才记录展示</tspan><tspan x="926" dy="36.0">采用 / 拒绝 / 撤销保留历史</tspan></text>
<rect x="64" y="470" width="690" height="172" rx="20" fill="#E0EDE6"/>
<text x="92" y="518" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">trace_id / span_id / execution_id</tspan></text>
<text x="92" y="565" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">每次执行保留阶段耗时与失败位置</tspan><tspan x="92" dy="36.0">重试沿用 task_id，新增 job_id</tspan></text>
<polyline points="520,360 520,470" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="930,360 930,420 550,420 550,470" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="405,642 405,700 370,700 370,750" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="1155,642 1155,700 1120,700 1120,750" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="64" y="750" width="700" height="224" rx="20" fill="#FFFFFF"/>
<text x="92" y="798" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">产品数据与质量中心</tspan></text>
<text x="92" y="845" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">任务表 · 阶段事件 · 逐图反馈</tspan><tspan x="92" dy="36.0">自动规则 · 人工评审 · Badcase</tspan><tspan x="92" dy="36.0">按 production / evaluation 分开查询</tspan></text>
<rect x="816" y="750" width="800" height="224" rx="20" fill="#FFFFFF"/>
<text x="844" y="798" font-size="29" font-weight="700" fill="#08754C"><tspan x="844" dy="0">Langfuse 与评测工具</tspan></text>
<text x="844" y="845" font-size="24" font-weight="400" fill="#1E2421"><tspan x="844" dy="0">过程追踪与独立评分关联 job / asset</tspan><tspan x="844" dy="36.0">回填读回成功与持续自动导出分别验收</tspan><tspan x="844" dy="36.0">不把接口成功、评分通过等同于采用</tspan></text>
<text x="64" y="1048" font-size="25" font-weight="400" fill="#63716A"><tspan x="64" dy="0">原图与模型响应受控保存；日志只保留标识、版本、用量和脱敏错误。</tspan></text>
</svg>