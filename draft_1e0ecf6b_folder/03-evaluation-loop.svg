<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1110" viewBox="0 0 1680 1110">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect x="0" y="0" width="1680" height="1110" fill="#F5F1EE"/>
<text x="64" y="74" font-size="40" font-weight="700" fill="#1E2421"><tspan x="64" dy="0">评测与 Badcase 闭环</tspan></text>
<text x="64" y="124" font-size="24" font-weight="400" fill="#63716A"><tspan x="64" dy="0">先检查交付，再检查事实与设计；每个结论关联输入、版本和证据</tspan></text>
<rect x="64" y="184" width="450" height="185" rx="20" fill="#FFFFFF"/>
<text x="92" y="232" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">确定性检查</tspan></text>
<text x="92" y="279" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">成品数量 / 文件 / 尺寸</tspan><tspan x="92" dy="36.0">固定文案 / 输入边界</tspan></text>
<rect x="606" y="184" width="450" height="185" rx="20" fill="#FFFFFF"/>
<text x="634" y="232" font-size="29" font-weight="700" fill="#08754C"><tspan x="634" dy="0">AI 辅助评审</tspan></text>
<text x="634" y="279" font-size="24" font-weight="400" fill="#1E2421"><tspan x="634" dy="0">非视觉评分：执行与文本</tspan><tspan x="634" dy="36.0">视觉预审：图像问题定位</tspan></text>
<rect x="1148" y="184" width="468" height="185" rx="20" fill="#FFFFFF"/>
<text x="1176" y="232" font-size="29" font-weight="700" fill="#08754C"><tspan x="1176" dy="0">人工视觉验收</tspan></text>
<text x="1176" y="279" font-size="24" font-weight="400" fill="#1E2421"><tspan x="1176" dy="0">商品 / 需求 / 交付门槛</tspan><tspan x="1176" dy="36.0">设计评分 + 采用判断</tspan></text>
<polyline points="514,273 606,273" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="1056,273 1148,273" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="64" y="432" width="718" height="146" rx="20" fill="#E0EDE6"/>
<text x="92" y="480" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">评估器有争议</tspan></text>
<text x="92" y="527" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">补充原图事实 → 人工复核 → 新版重评</tspan></text>
<rect x="830" y="432" width="786" height="146" rx="20" fill="#E0EDE6"/>
<text x="858" y="480" font-size="29" font-weight="700" fill="#08754C"><tspan x="858" dy="0">产品出现问题</tspan></text>
<text x="858" y="527" font-size="24" font-weight="400" fill="#1E2421"><tspan x="858" dy="0">保存原始证据 → 建立 Badcase → 定位阶段</tspan></text>
<polyline points="830,369 830,397 420,397 420,432" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="1382,369 1382,432" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="64" y="656" width="450" height="205" rx="20" fill="#FFFFFF"/>
<text x="92" y="704" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">归因</tspan></text>
<text x="92" y="751" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">区分已证实事实与假设</tspan><tspan x="92" dy="36.0">定位最早偏离预期的位置</tspan><tspan x="92" dy="36.0">一条问题可关联多个复现</tspan></text>
<rect x="606" y="656" width="450" height="205" rx="20" fill="#FFFFFF"/>
<text x="634" y="704" font-size="29" font-weight="700" fill="#08754C"><tspan x="634" dy="0">定向修复与回归</tspan></text>
<text x="634" y="751" font-size="24" font-weight="400" fill="#1E2421"><tspan x="634" dy="0">固定输入 / 模型 / 数量</tspan><tspan x="634" dy="36.0">优先复用底图验证排版</tspan><tspan x="634" dy="36.0">新版本保留前后证据</tspan></text>
<rect x="1148" y="656" width="468" height="205" rx="20" fill="#FFFFFF"/>
<text x="1176" y="704" font-size="29" font-weight="700" fill="#08754C"><tspan x="1176" dy="0">关闭条件</tspan></text>
<text x="1176" y="751" font-size="24" font-weight="400" fill="#1E2421"><tspan x="1176" dy="0">原问题通过复验</tspan><tspan x="1176" dy="36.0">相邻场景没有严重退步</tspan><tspan x="1176" dy="36.0">当前版本人工确认</tspan></text>
<polyline points="1223,578 1223,610 289,610 289,656" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="514,755 606,755" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polyline points="1056,755 1148,755" stroke="#08754C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="64" y="921" width="1552" height="116" rx="20" fill="#E0EDE6"/>
<text x="92" y="969" font-size="29" font-weight="700" fill="#08754C"><tspan x="92" dy="0">未通过回归 → 保持 investigating</tspan></text>
<text x="92" y="1016" font-size="24" font-weight="400" fill="#1E2421"><tspan x="92" dy="0">修改归因、修复方案或图片版本后，旧的回归通过记录不能直接复用。</tspan></text>
</svg>