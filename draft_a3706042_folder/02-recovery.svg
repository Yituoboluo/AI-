<text x="897.5" y="189.0" text-anchor="middle" font-family="Noto Sans SC" font-size="18" fill="#1f2937">新增生成调用=0</text>
<rect x="365" y="330" width="285" height="85" rx="14" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
<text x="507.5" y="366.5" text-anchor="middle" font-family="Noto Sans SC" font-size="18" fill="#1f2937">状态未知：核验原请求</text>
<text x="507.5" y="391.5" text-anchor="middle" font-family="Noto Sans SC" font-size="18" fill="#1f2937">不自动追加付费调用</text>
