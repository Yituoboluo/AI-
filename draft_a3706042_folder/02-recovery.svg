<text x="562.5" y="536.5" text-anchor="middle" font-family="Noto Sans SC" font-size="18" fill="#1f2937">创建关联新执行</text>
<rect x="790" y="470" width="235" height="95" rx="14" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
