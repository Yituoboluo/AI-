<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630">
<rect x="0" y="0" width="1080" height="630" fill="#ffffff"/>
<text x="36" y="44" font-family="Noto Sans SC" font-size="25" font-weight="700" fill="#1f2937">失败处理：先核验，再决定恢复或重试</text>
<text x="36" y="76" font-family="Noto Sans SC" font-size="16" fill="#4b5563">成功方向保留；恢复只取回原结果；新生成需要明确选择</text>
