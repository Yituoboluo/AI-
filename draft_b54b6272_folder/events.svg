<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1255" viewBox="0 0 1600 1255">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z" fill="#7A4A33"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1255" rx="0" fill="#FFF8EE"/>
  <text x="70" y="100" font-size="54" font-weight="700" fill="#7A4A33" text-anchor="start">一次创作如何留下可追踪记录</text>
  <circle cx="195" cy="290" r="58" fill="#F9C2BD"/>
  <text x="195" y="304" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">1</text>
  <text x="195" y="403" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">上传</text>
  <text x="195" y="447" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">客户端</text>
  <line x1="273" y1="290" x2="406" y2="290" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="490" cy="290" r="58" fill="#F9C2BD"/>
  <text x="490" y="304" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">2</text>
  <text x="490" y="403" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">抠图</text>
  <text x="490" y="447" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">客户端</text>
  <line x1="568" y1="290" x2="701" y2="290" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="785" cy="290" r="58" fill="#F69834"/>
  <text x="785" y="304" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">3</text>
  <text x="785" y="403" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">生成受理</text>
  <text x="785" y="447" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">服务端</text>
  <line x1="863" y1="290" x2="996" y2="290" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="1080" cy="290" r="58" fill="#F69834"/>
  <text x="1080" y="304" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">4</text>
  <text x="1080" y="403" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">设计策略</text>
  <text x="1080" y="447" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">服务端</text>
  <line x1="1158" y1="290" x2="1291" y2="290" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="1375" cy="290" r="58" fill="#F69834"/>
  <text x="1375" y="304" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">5</text>
  <text x="1375" y="403" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">模型生图</text>
  <text x="1375" y="447" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">服务端</text>
  <line x1="1375" y1="486" x2="1375" y2="552" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="1375" cy="635" r="58" fill="#F69834"/>
  <text x="1375" y="649" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">6</text>
  <text x="1375" y="748" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">成品保存</text>
  <text x="1375" y="792" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">服务端</text>
  <line x1="1297" y1="635" x2="1064" y2="635" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="980" cy="635" r="58" fill="#F9C2BD"/>
  <text x="980" y="649" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">7</text>
  <text x="980" y="748" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">结果展示</text>
  <text x="980" y="792" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">客户端</text>
  <line x1="902" y1="635" x2="669" y2="635" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="585" cy="635" r="58" fill="#F69834"/>
  <text x="585" y="649" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">8</text>
  <text x="585" y="748" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">反馈保存</text>
  <text x="585" y="792" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">服务端</text>
  <line x1="507" y1="635" x2="274" y2="635" stroke="#7A4A33" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="190" cy="635" r="58" fill="#F69834"/>
  <text x="190" y="649" font-size="40" font-weight="700" fill="#7A4A33" text-anchor="middle">9</text>
  <text x="190" y="748" font-size="34" font-weight="700" fill="#7A4A33" text-anchor="middle">导出请求</text>
  <text x="190" y="792" font-size="24" font-weight="400" fill="#7A4A33" text-anchor="middle">服务端</text>
  <rect x="70" y="848" width="702" height="111" rx="24" fill="#F9C2BD"/>
  <text x="102" y="893" font-size="29" font-weight="700" fill="#7A4A33" text-anchor="start">模型返回 ≠ 保存成功</text>
  <text x="102" y="934" font-size="25" font-weight="400" fill="#7A4A33" text-anchor="start">以合成图片持久化成功为保存节点</text>
  <rect x="802" y="848" width="728" height="111" rx="24" fill="#F69834"/>
  <text x="834" y="893" font-size="29" font-weight="700" fill="#7A4A33" text-anchor="start">导出请求 ≠ 文件已投放</text>
  <text x="834" y="934" font-size="25" font-weight="400" fill="#7A4A33" text-anchor="start">记录用户发起请求的行为</text>
  <text x="70" y="1033" font-size="32" font-weight="700" fill="#7A4A33" text-anchor="start">用三层标识串起证据</text>
  <rect x="70" y="1070" width="457" height="132" rx="24" fill="#F9C2BD"/>
  <text x="100" y="1120" font-size="32" font-weight="700" fill="#7A4A33" text-anchor="start">task_id</text>
  <text x="100" y="1168" font-size="25" font-weight="400" fill="#7A4A33" text-anchor="start">贯穿同一个逻辑创意任务</text>
  <rect x="556" y="1070" width="457" height="132" rx="24" fill="#F69834"/>
  <text x="586" y="1120" font-size="32" font-weight="700" fill="#7A4A33" text-anchor="start">job_id</text>
  <text x="586" y="1168" font-size="25" font-weight="400" fill="#7A4A33" text-anchor="start">区分每次执行尝试</text>
  <rect x="1042" y="1070" width="488" height="132" rx="24" fill="#F9C2BD"/>
  <text x="1072" y="1120" font-size="32" font-weight="700" fill="#7A4A33" text-anchor="start">asset_id + version</text>
  <text x="1072" y="1168" font-size="25" font-weight="400" fill="#7A4A33" text-anchor="start">定位已保存的具体图片</text>
</svg>
